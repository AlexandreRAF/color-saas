# Use a private network and authenticated TLS with deployment-provided paths.
bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/secrets/redis.crt
tls-key-file /run/secrets/redis.key
tls-ca-cert-file /run/secrets/ca.crt
tls-auth-clients no
aclfile /run/secrets/redis.acl
appendonly yes
appendfsync everysec
maxmemory-policy noeviction
save 60 1000
