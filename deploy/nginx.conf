# Include inside the nginx http block; inject certificates through your platform.
limit_req_zone $binary_remote_addr zone=color_api:10m rate=15r/s;
upstream color_api { server api:3000; keepalive 32; }
server {
    listen 443 ssl;
    server_name color.example.com;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    location /api/ {
        limit_req zone=color_api burst=30 nodelay;
        proxy_pass http://color_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite untrusted client forwarding headers at the sole trusted hop.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }
    location /health/ { proxy_pass http://color_api; }
    # Production CDN serves dist/ at this origin. These local static files are
    # suitable as its origin; never cache /api or Stripe webhooks at the CDN.
    location / {
        root /srv/color/dist;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
